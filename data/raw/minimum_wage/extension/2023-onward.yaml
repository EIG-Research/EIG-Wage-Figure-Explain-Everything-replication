metadata:
  description: Forward extension of Vaghul-Zipperer state and sub-state minimum wage panels, 2023-01-01 onward.
  generated_at: '2026-05-05'
  generator: code/_utils/synthesize_extension_yaml.py
  sources:
  - name: DOL_WHD_history_2026-05-04
    url: https://www.dol.gov/agencies/whd/state/minimum-wage/history
    description: U.S. DOL Wage and Hour Division historical state minimum wage table (annual rates 1968-2024).
  - name: EPI_tracker_2026-05-04
    url: https://www.epi.org/minimum-wage-tracker/
    description: EPI Minimum Wage Tracker (current rates plus most-recent and upcoming changes).
  schema_version: '0.3'
  effective_date_convention: YYYY-MM-DD; inferred_effective_date=true marks dates defaulted to Jan 1 because the source provides
    only annual snapshots (DOL) or because the date is inferred from EPI rate_from of a subsequent event (indexed states).
  rate_units: nominal USD per hour
  rate_min: general state or local minimum wage
  rate_tipped: cash subminimum for tipped workers; null if not separately documented
  locality_id: stable snake_case slug for substate events (e.g., ca_san_francisco). Used as the join key in 20c/20d. State
    events do not carry locality_id.
  change_log:
  - 'v0.1 -> v0.2: added inferred Jan 1, 2025 step events for indexed states whose EPI rate_from differs from DOL 2024 rate.'
  - 'v0.2 -> v0.3 (2026-05-05): every substate event now carries locality_id (stable slug) to fix the New York tri-county
    join failure and to harden the join against free-text drift.'
